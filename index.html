<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>纳指定投助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-yellow: #eab308;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --border: #334155;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-badge.live {
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
    }

    .status-badge.loading {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.live .status-dot {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      gap: 2px;
      padding: 8px 16px 0;
      background: var(--bg-primary);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-nav::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: none;
      padding: 8px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent-blue);
      background: var(--bg-card);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    /* Main Content */
    .main {
      padding: 12px 16px 100px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .emoji {
      font-size: 18px;
    }

    /* Data Grid */
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .data-item {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .data-item.full {
      grid-column: 1 / -1;
    }

    .data-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .data-value {
      font-size: 16px;
      font-weight: 700;
    }

    .data-value.small {
      font-size: 13px;
      font-weight: 600;
    }

    .data-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Colors */
    .green { color: var(--accent-green); }
    .red { color: var(--accent-red); }
    .blue { color: var(--accent-blue); }
    .yellow { color: var(--accent-yellow); }
    .orange { color: var(--accent-orange); }
    .purple { color: var(--accent-purple); }
    .muted { color: var(--text-muted); }

    /* PE Gauge */
    .pe-gauge {
      position: relative;
      height: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      margin: 12px 0;
      overflow: visible;
    }

    .pe-gauge-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s ease;
    }

    .pe-gauge-marker {
      position: absolute;
      top: -4px;
      width: 3px;
      height: 16px;
      background: white;
      border-radius: 2px;
      transform: translateX(-50%);
      transition: left 0.8s ease;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .pe-gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Action Card */
    .action-card {
      border: 2px solid;
      position: relative;
      overflow: hidden;
    }

    .action-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .action-card.buy-double {
      border-color: var(--accent-green);
    }
    .action-card.buy-double::before {
      background: linear-gradient(90deg, var(--accent-green), transparent);
    }

    .action-card.buy-normal {
      border-color: var(--accent-blue);
    }
    .action-card.buy-normal::before {
      background: linear-gradient(90deg, var(--accent-blue), transparent);
    }

    .action-card.buy-half {
      border-color: var(--accent-yellow);
    }
    .action-card.buy-half::before {
      background: linear-gradient(90deg, var(--accent-yellow), transparent);
    }

    .action-card.buy-min {
      border-color: var(--accent-orange);
    }
    .action-card.buy-min::before {
      background: linear-gradient(90deg, var(--accent-orange), transparent);
    }

    .action-card.buy-zero {
      border-color: var(--accent-red);
    }
    .action-card.buy-zero::before {
      background: linear-gradient(90deg, var(--accent-red), transparent);
    }

    .action-amount {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      margin: 8px 0;
    }

    .action-reason {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Event List */
    .event-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .event-date {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-blue);
      min-width: 50px;
    }

    .event-name {
      font-size: 13px;
      font-weight: 600;
    }

    .event-impact {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .event-impact.bullish {
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
    }

    .event-impact.bearish {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
    }

    .event-impact.neutral {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-secondary);
    }

    /* Trend Section */
    .trend-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }

    .trend-arrow {
      font-size: 24px;
    }

    .trend-text {
      font-size: 14px;
      font-weight: 600;
    }

    .trend-detail {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Quote */
    .quote-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(168, 85, 247, 0.1));
      border: 1px solid rgba(59, 130, 246, 0.2);
      text-align: center;
      padding: 20px 16px;
    }

    .quote-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .quote-source {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Loading */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Error */
    .error-container {
      padding: 40px 20px;
      text-align: center;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .error-msg {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .retry-btn {
      padding: 10px 24px;
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .retry-btn:active {
      transform: scale(0.97);
    }

    /* Settings Panel */
    .settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      display: none;
    }

    .settings-overlay.show {
      display: block;
    }

    .settings-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 40px;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 80vh;
      overflow-y: auto;
    }

    .settings-overlay.show .settings-panel {
      transform: translateY(0);
    }

    .settings-handle {
      width: 40px;
      height: 4px;
      background: var(--text-muted);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .settings-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .setting-group {
      margin-bottom: 16px;
    }

    .setting-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .setting-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .setting-input:focus {
      border-color: var(--accent-blue);
    }

    .settings-save {
      width: 100%;
      padding: 12px;
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* History Table */
    .history-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }

    .history-item:last-child { border-bottom: none; }

    .history-date {
      flex: 1;
      color: var(--text-secondary);
    }

    .history-action {
      flex: 1;
      text-align: center;
      font-weight: 600;
    }

    .history-amount {
      flex: 1;
      text-align: right;
      font-weight: 700;
    }

    /* Mini Chart */
    .mini-chart-container {
      height: 120px;
      position: relative;
      margin: 8px 0;
    }

    .mini-chart-container canvas {
      width: 100%;
      height: 100%;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* Disclaimer */
    .disclaimer {
      text-align: center;
      padding: 16px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Refresh button */
    .refresh-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      font-size: 18px;
      transition: transform 0.3s;
    }

    .refresh-btn:active {
      transform: rotate(180deg);
    }

    .refresh-btn.spinning {
      animation: spin 1s linear infinite;
    }

    /* Gear button */
    .gear-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      font-size: 20px;
    }

    /* Summary cards row */
    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 12px 10px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .summary-card .label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .summary-card .value {
      font-size: 18px;
      font-weight: 800;
    }

    .summary-card .sub {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Section divider */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Alert banner */
    .alert-banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-banner.warning {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: var(--accent-yellow);
    }

    .alert-banner.danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--accent-red);
    }

    .alert-banner.info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <h1>📊 纳指定投助手</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="statusBadge" class="status-badge loading">
          <span class="status-dot"></span>
          <span id="statusText">加载中</span>
        </span>
        <button class="refresh-btn" id="refreshBtn" onclick="refreshData()" title="刷新数据">🔄</button>
        <button class="gear-btn" onclick="toggleSettings()" title="设置">⚙️</button>
      </div>
    </div>
    <div class="header-time" id="headerTime">--</div>
  </div>

  <!-- Tab Navigation -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('today')">今日决策</button>
    <button class="tab-btn" onclick="switchTab('short')">短期建议</button>
    <button class="tab-btn" onclick="switchTab('mid')">中期复盘</button>
    <button class="tab-btn" onclick="switchTab('long')">长期趋势</button>
    <button class="tab-btn" onclick="switchTab('history')">定投记录</button>
  </div>

  <!-- Main Content -->
  <div class="main">

    <!-- Loading State -->
    <div id="loadingState" class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在获取最新市场数据...</div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="error-container" style="display:none;">
      <div class="error-icon">⚠️</div>
      <div class="error-msg" id="errorMsg">数据加载失败</div>
      <button class="retry-btn" onclick="refreshData()">重新加载</button>
    </div>

    <!-- Today Tab -->
    <div id="tab-today" class="tab-content">
      <!-- Will be populated by JS -->
    </div>

    <!-- Short Term Tab -->
    <div id="tab-short" class="tab-content">
      <!-- Will be populated by JS -->
    </div>

    <!-- Mid Term Tab -->
    <div id="tab-mid" class="tab-content">
      <!-- Will be populated by JS -->
    </div>

    <!-- Long Term Tab -->
    <div id="tab-long" class="tab-content">
      <!-- Will be populated by JS -->
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="tab-content">
      <!-- Will be populated by JS -->
    </div>

  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)">
    <div class="settings-panel" onclick="event.stopPropagation()">
      <div class="settings-handle"></div>
      <div class="settings-title">⚙️ 个人定投参数</div>

      <div class="setting-group">
        <div class="setting-label">累计投入金额（元）</div>
        <input type="number" class="setting-input" id="setTotalInvested" placeholder="例如：50000">
      </div>

      <div class="setting-group">
        <div class="setting-label">持仓成本（每份均价，元）</div>
        <input type="number" class="setting-input" id="setAvgCost" placeholder="例如：1.2">
      </div>

      <div class="setting-group">
        <div class="setting-label">当前持仓市值（元）</div>
        <input type="number" class="setting-input" id="setCurrentValue" placeholder="例如：55000">
      </div>

      <div class="setting-group">
        <div class="setting-label">开始定投日期</div>
        <input type="date" class="setting-input" id="setStartDate">
      </div>

      <div class="setting-group">
        <div class="setting-label">总资产（元）</div>
        <input type="number" class="setting-input" id="setTotalAssets" value="650000">
      </div>

      <button class="settings-save" onclick="saveSettings()">💾 保存设置</button>
    </div>
  </div>

  <!-- Disclaimer -->
  <div class="disclaimer">
    ⚠️ 基于公开数据，仅供参考。投资有风险，决策需谨慎。<br>
    数据来源：Yahoo Finance | 更新延迟约15-20分钟
  </div>

  <script src="app.js"></script>
  <script>
    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
